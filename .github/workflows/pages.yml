name: Publicar apresentação no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v6
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar página
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
